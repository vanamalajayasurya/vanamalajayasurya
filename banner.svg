<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#6C63FF"><animate attributeName="stop-color" values="#6C63FF;#2EBFB3;#FF6B9D;#6C63FF" dur="10s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#0D1117"/></linearGradient>
<filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<style>
.name{font:900 46px Impact,'Arial Black',sans-serif;letter-spacing:4px;fill:#FFD700;fill-opacity:0;stroke:#FFD700;stroke-width:1.5;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw 3s ease forwards,fillin 1s 2.6s forwards}
.sub{font:600 22px 'Courier New',monospace;fill:#fff;opacity:0;animation:fade 1s 3s forwards}
.tag{font:600 16px 'Courier New',monospace;fill:#2EBFB3;opacity:0;animation:fade 1s 3.6s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1}}
@keyframes fade{to{opacity:1}}
.ring{transform-origin:450px 100px;animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style></defs>
